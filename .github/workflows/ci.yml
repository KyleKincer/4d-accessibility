name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Check repository and installer
        run: |
          python3 ci/check_repository.py
          python3 test_install_host_methods.py
      - name: Test session and grid models
        run: |
          python3 test.py
          python3 test_grids.py
      - name: Build native plugin and AppKit tests
        run: |
          python3 build.py
          python3 test_native.py
      - name: Build compiled component with pinned tool4d
        run: |
          python3 ci/download_tool4d.py
          python3 build_component.py --tool4d build/toolchain/tool4d.app
      - name: Package development artifacts
        run: |
          python3 package_release.py
          python3 test_release_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 14
