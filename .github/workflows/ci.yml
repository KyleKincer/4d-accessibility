name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      preview_tag:
        description: 'Optional candidate tag, vVERSION-rc.N; prepares a draft prerelease after these checks'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Check repository and installer
        run: |
          python3 ci/check_repository.py
          python3 test_install_host_methods.py
      - name: Test session and grid models
        run: |
          python3 test.py
          python3 test_grids.py
      - name: Build native plugin and AppKit tests
        run: |
          python3 build.py
          python3 test_native.py
          python3 test_grid_value_speech.py
      - name: Build compiled component with pinned tool4d
        run: |
          python3 ci/download_tool4d.py
          python3 build_component.py --tool4d build/toolchain/tool4d.app
      - name: Package development artifacts
        run: |
          python3 package_release.py
          python3 test_release_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.preview_tag != '' && github.ref == 'refs/heads/main'
    needs: macos
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare tested development kit as a draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ inputs.preview_tag }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          version = pathlib.Path('VERSION').read_text().strip()
          tag = os.environ['PREVIEW_TAG']
          assert re.fullmatch(r'v' + re.escape(version) + r'-rc\.[1-9][0-9]*', tag), 'Use vVERSION-rc.N'
          subprocess.run(['gh', 'run', 'download', os.environ['GITHUB_RUN_ID'], '--name', 'development-macos', '--dir', 'dist'], check=True)
          subprocess.run(['sha256sum', '--check', 'SHA256SUMS'], cwd='dist', check=True)
          subprocess.run(['gh', 'release', 'create', tag, '--target', os.environ['GITHUB_SHA'],
                          '--draft', '--prerelease', '--latest=false', '--title', tag, '--notes-file', 'RELEASE-NOTES.md',
                          *[str(p) for p in sorted(pathlib.Path('dist').iterdir()) if p.is_file()]], check=True)
          PY
