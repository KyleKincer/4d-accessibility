name: Signed release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          match = re.fullmatch(r'v(\d+\.\d+\.\d+)(?:-[a-zA-Z0-9][a-zA-Z0-9.-]*)?', tag)
          assert match and match[1] == pathlib.Path('VERSION').read_text().strip(), 'Tag must match VERSION'
          PY
      - name: Prepare signing credentials
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          PLUGIN_ID_REGISTERED: ${{ vars.PLUGIN_ID_REGISTERED }}
        run: python3 ci/signing_keychain.py
      - name: Build and test matching packages
        run: |
          python3 ci/check_repository.py
          python3 test_install_host_methods.py
          python3 test_signing_keychain.py
          python3 test.py
          python3 test_grids.py
          python3 build.py
          python3 test_native.py
          python3 ci/download_tool4d.py
          python3 build_component.py --tool4d build/toolchain/tool4d.app
      - name: Package, sign and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          python3 package_release.py --sign "$APPLE_SIGNING_IDENTITY" --keychain "$RUNNER_TEMP/accessibility-release.keychain-db" --notary-profile accessibility-release
          python3 test_release_package.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          tag = os.environ['RELEASE_TAG']
          args = ['gh', 'release', 'create', tag, '--verify-tag', '--title', tag, '--notes-file', 'RELEASE-NOTES.md']
          if '-' in tag:
              args.append('--prerelease')
          subprocess.run(args + [str(p) for p in sorted(pathlib.Path('dist').iterdir()) if p.is_file()], check=True)
          PY
      - name: Remove signing credentials
        if: always()
        run: python3 ci/signing_keychain.py cleanup
